name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

env:
  FLUTTER_VERSION: '3.38.5'
  APP_NAME: 'Kiokuu'
  PACKAGE_NAME: 'kiokuu'
  DEB_PACKAGE_NAME: 'kiokuu'  # Debian requires lowercase alphanums and -+. only
  APP_ID: 'com.kiokuu.app'
  BUILD_NUMBER_OFFSET: 2500

jobs:
  # ============================================================================
  # ANDROID BUILD - Split APKs for reduced size
  # ============================================================================
  build-android:
    name: Build Android (Split APKs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          fi

      - name: Create key.properties
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEY_ALIAS" ]; then
            cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
          fi

      # Build split APKs per ABI for reduced APK size
      - name: Build Split APKs (per ABI)
        run: flutter build apk --release --split-per-abi --build-number=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))

      # Also build App Bundle for Play Store
      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release --build-number=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))

      - name: Rename artifacts
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present
          
          mkdir -p release-artifacts/android
          
          # Rename split APKs
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            if [ -f "$apk" ]; then
              abi=$(basename "$apk" | sed 's/app-\(.*\)-release.apk/\1/')
              cp "$apk" "release-artifacts/android/${PACKAGE_NAME}-${VERSION}-${abi}.apk"
            fi
          done
          
          # Copy universal APK if exists
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" \
               "release-artifacts/android/${PACKAGE_NAME}-${VERSION}-universal.apk"
          fi
          
          # Copy AAB
          cp build/app/outputs/bundle/release/app-release.aab \
             "release-artifacts/android/${PACKAGE_NAME}-${VERSION}.aab"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/android/
          retention-days: 30

  # ============================================================================
  # iOS BUILD
  # ============================================================================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS (No Code Signing for CI)
        run: |
          flutter build ios --release --no-codesign --build-number=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))

      - name: Create IPA
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          
          mkdir -p release-artifacts/ios
          
          # Create Payload directory and copy app
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          
          # Create IPA
          zip -r "release-artifacts/ios/${PACKAGE_NAME}-${VERSION}-ios.ipa" Payload
          rm -rf Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: release-artifacts/ios/
          retention-days: 30

  # ============================================================================
  # macOS BUILD
  # ============================================================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd macos
          pod install || true  # Some projects don't use pods

      - name: Build macOS
        run: flutter build macos --release --build-number=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))

      - name: Create DMG
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          
          mkdir -p release-artifacts/macos
          
          APP_PATH="build/macos/Build/Products/Release/${APP_NAME}.app"
          
          # Verify the .app bundle exists
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ ERROR: App bundle not found at $APP_PATH"
            echo "Contents of build/macos/Build/Products/Release/:"
            ls -la "build/macos/Build/Products/Release/" || echo "Directory does not exist"
            exit 1
          fi
          
          echo "✅ Found app bundle at $APP_PATH"
          echo "App bundle size: $(du -sh "$APP_PATH" | cut -f1)"
          
          # Install create-dmg
          brew install create-dmg || true
          
          # Create DMG with proper icon positioning
          # --icon positions the app at x=175, --app-drop-link positions Applications at x=425
          if create-dmg \
            --volname "${APP_NAME}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 175 185 \
            --app-drop-link 425 185 \
            --hide-extension "${APP_NAME}.app" \
            "release-artifacts/macos/${PACKAGE_NAME}-${VERSION}-macos.dmg" \
            "$APP_PATH"; then
            echo "✅ DMG created successfully"
          else
            echo "⚠️ create-dmg failed, falling back to zip"
            cd "build/macos/Build/Products/Release"
            zip -r "../../../../../release-artifacts/macos/${PACKAGE_NAME}-${VERSION}-macos.zip" "${APP_NAME}.app"
            echo "✅ ZIP fallback created"
          fi
          
          # Verify output
          echo "📦 Release artifacts:"
          ls -la release-artifacts/macos/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-artifacts/macos/
          retention-days: 30

  # ============================================================================
  # WINDOWS BUILD
  # ============================================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --build-number=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))

      - name: Create MSIX Package
        shell: pwsh
        run: |
          $VERSION = "${{ github.event.inputs.version || github.ref_name }}"
          $VERSION = $VERSION -replace '^v', ''
          $BUILD_NUMBER = ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }}
          
          # Calculate 4-part MSIX version (a.b.c.d)
          # If version is 0.9.2, MSIX version becomes 0.9.2.2501
          $MSIX_VERSION = "${VERSION}.${BUILD_NUMBER}"
          
          Write-Host "Setting MSIX version to: $MSIX_VERSION"
          
          # Update pubspec.yaml with dynamic version for msix tool
          $pubspec = Get-Content pubspec.yaml -Raw
          # Use multiline regex - update msix_version first, then main version (anchored to line start)
          $pubspec = $pubspec -replace 'msix_version: .*', "msix_version: $MSIX_VERSION"
          $pubspec = $pubspec -replace '(?m)^version: .*', "version: ${VERSION}+${BUILD_NUMBER}"
          Set-Content pubspec.yaml $pubspec
          
          # Install MSIX packaging tool
          flutter pub add msix --dev
          flutter pub get
          
          # Create MSIX (skip certificate installation prompt for CI)
          dart run msix:create --build-windows false --install-certificate false

      - name: Package Windows Build
        shell: pwsh
        run: |
          $VERSION = "${{ github.event.inputs.version || github.ref_name }}"
          $VERSION = $VERSION -replace '^v', ''
          
          New-Item -ItemType Directory -Force -Path "release-artifacts/windows"
          
          # Copy MSIX if exists
          $msixPath = Get-ChildItem -Path "build/windows" -Recurse -Filter "*.msix" | Select-Object -First 1
          if ($msixPath) {
            Copy-Item $msixPath.FullName "release-artifacts/windows/${{ env.PACKAGE_NAME }}-$VERSION-windows.msix"
          }
          
          # Create launcher script that enables Impeller for better performance
          $launcherContent = @"
          @echo off
          REM Enable Impeller rendering engine for smoother animations
          set FLUTTER_ENGINE_SWITCHES=1
          set FLUTTER_ENGINE_SWITCH_1=enable-impeller=true
          start "" "%~dp0${{ env.PACKAGE_NAME }}.exe"
          "@
          Set-Content -Path "build/windows/x64/runner/Release/${{ env.APP_NAME }}.bat" -Value $launcherContent
          
          # Create ZIP of the release folder
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "release-artifacts/windows/${{ env.PACKAGE_NAME }}-$VERSION-windows-portable.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/windows/
          retention-days: 30

  # ============================================================================
  # LINUX BUILD - DEB, RPM, AppImage
  # ============================================================================
  build-linux:
    name: Build Linux (DEB, RPM, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build libgtk-3-dev \
            libblkid-dev liblzma-dev \
            libsecret-1-dev \
            rpm patchelf \
            libfuse2 \
            libmpv-dev mpv

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release --build-number=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Create Packaging Configuration
        run: |
          mkdir -p dist
          cat > dist/distribute_options.yaml << 'EOF'
          output: build/dist
          releases:
            - name: linux
              jobs:
                - name: linux-deb
                  package:
                    platform: linux
                    target: deb
                - name: linux-rpm
                  package:
                    platform: linux
                    target: rpm
                - name: linux-appimage
                  package:
                    platform: linux
                    target: appimage
          EOF

      - name: Create make_config for DEB
        run: |
          mkdir -p linux/packaging/deb
          cat > linux/packaging/deb/make_config.yaml << EOF
          display_name: ${{ env.APP_NAME }}
          package_name: ${{ env.DEB_PACKAGE_NAME }}
          maintainer: Kiokuu Team <support@kiokuu.app>
          description: A beautiful music streaming and management application
          long_description: |
            Kiokuu is a feature-rich music application that allows you to 
            stream, manage, and enjoy your music collection across all your devices.
          homepage: https://github.com/Xumi-cc/Kiokuu
          section: sound
          priority: optional
          installed_size: 50000
          essential: false
          icon: assets/images/logo_black_bg_white.png
          postinstall_scripts:
            - echo "Kiokuu installed successfully"
          keywords:
            - Music
            - Audio
            - Streaming
            - Player
          categories:
            - Audio
            - Music
            - Player
          startup_notify: true
          EOF

      - name: Create make_config for RPM
        run: |
          mkdir -p linux/packaging/rpm
          cat > linux/packaging/rpm/make_config.yaml << EOF
          display_name: ${{ env.APP_NAME }}
          package_name: ${{ env.PACKAGE_NAME }}
          maintainer: Kiokuu Team <support@kiokuu.app>
          description: A beautiful music streaming and management application
          license: Proprietary
          group: Applications/Multimedia
          icon: assets/images/logo_black_bg_white.png
          EOF

      - name: Create make_config for AppImage
        run: |
          mkdir -p linux/packaging/appimage
          cat > linux/packaging/appimage/make_config.yaml << EOF
          display_name: ${{ env.APP_NAME }}
          package_name: ${{ env.PACKAGE_NAME }}
          icon: assets/images/logo_black_bg_white.png
          keywords:
            - Music
            - Audio
            - Streaming
          categories:
            - Audio
            - Music
          startup_notify: true
          EOF

      - name: Create Desktop Entry
        run: |
          mkdir -p linux/packaging/appimage
          cat > linux/packaging/appimage/${{ env.PACKAGE_NAME }}.desktop << EOF
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Comment=A beautiful music streaming and management application
          Exec=${{ env.PACKAGE_NAME }}
          Icon=${{ env.PACKAGE_NAME }}
          Terminal=false
          Type=Application
          Categories=Audio;Music;Player;
          Keywords=music;audio;streaming;player;
          StartupNotify=true
          StartupWMClass=${{ env.PACKAGE_NAME }}
          EOF

      - name: Build DEB Package
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          BUILD_NUMBER=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))
          
          # Create DEB package structure
          mkdir -p deb_root/DEBIAN
          mkdir -p deb_root/usr/bin
          mkdir -p deb_root/usr/lib/${{ env.PACKAGE_NAME }}
          mkdir -p deb_root/usr/share/applications
          mkdir -p deb_root/usr/share/icons/hicolor/256x256/apps
          mkdir -p deb_root/usr/share/pixmaps
          
          # Copy application files
          cp -r build/linux/x64/release/bundle/* deb_root/usr/lib/${{ env.PACKAGE_NAME }}/
          
          # Create launcher script
          cat > deb_root/usr/bin/${{ env.PACKAGE_NAME }} << 'LAUNCHER'
          #!/bin/bash
          cd /usr/lib/${{ env.PACKAGE_NAME }}
          ./${{ env.PACKAGE_NAME }} "$@"
          LAUNCHER
          chmod +x deb_root/usr/bin/${{ env.PACKAGE_NAME }}
          
          # Create desktop entry
          cat > deb_root/usr/share/applications/${{ env.PACKAGE_NAME }}.desktop << DESKTOP
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Comment=A beautiful music streaming and management application
          Exec=${{ env.PACKAGE_NAME }}
          Icon=${{ env.PACKAGE_NAME }}
          Terminal=false
          Type=Application
          Categories=Audio;Music;Player;AudioVideo;
          Keywords=music;audio;streaming;player;cloud;
          StartupNotify=true
          StartupWMClass=${{ env.PACKAGE_NAME }}
          DESKTOP
          
          # Copy icon
          cp assets/images/logo_black_bg_white.png deb_root/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png
          cp assets/images/logo_black_bg_white.png deb_root/usr/share/pixmaps/${{ env.PACKAGE_NAME }}.png
          
          # Create control file (Include build number in version)
          INSTALLED_SIZE=$(du -sk deb_root | cut -f1)
          cat > deb_root/DEBIAN/control << CONTROL
          Package: ${{ env.DEB_PACKAGE_NAME }}
          Version: ${VERSION}-${BUILD_NUMBER}
          Section: sound
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: Kiokuu Team <support@kiokuu.app>
          Depends: libgtk-3-0, libmpv1 | libmpv2, libc6
          Homepage: https://github.com/Xumi-cc/Kiokuu
          Description: A beautiful music streaming and management application
           Kiokuu is a feature-rich music application that allows you to
           stream, manage, and enjoy your music collection across all your devices.
           .
           Features include cloud synchronization, lyrics display, equalizer,
           and cross-platform support.
          CONTROL
          
          # Build DEB
          dpkg-deb --build deb_root
          mkdir -p release-artifacts/linux
          mv deb_root.deb "release-artifacts/linux/${{ env.DEB_PACKAGE_NAME }}_${VERSION}-${BUILD_NUMBER}_amd64.deb"

      - name: Build RPM Package
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          BUILD_NUMBER=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))
          
          # Create RPM build directory structure
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          # Create source tarball
          mkdir -p "${{ env.PACKAGE_NAME }}-${VERSION}"
          cp -r build/linux/x64/release/bundle/* "${{ env.PACKAGE_NAME }}-${VERSION}/"
          tar czf "rpmbuild/SOURCES/${{ env.PACKAGE_NAME }}-${VERSION}.tar.gz" "${{ env.PACKAGE_NAME }}-${VERSION}"
          rm -rf "${{ env.PACKAGE_NAME }}-${VERSION}"
          
          # Create spec file (Use build number as release)
          cat > rpmbuild/SPECS/${{ env.PACKAGE_NAME }}.spec << SPEC
          Name:           ${{ env.PACKAGE_NAME }}
          Version:        ${VERSION}
          Release:        ${BUILD_NUMBER}%{?dist}
          Summary:        A beautiful music streaming and management application
          
          License:        Proprietary
          URL:            https://github.com/Xumi-cc/Kiokuu
          Source0:        %{name}-%{version}.tar.gz
          
          Requires:       gtk3, mpv-libs
          
          %description
          Kiokuu is a feature-rich music application that allows you to
          stream, manage, and enjoy your music collection across all your devices.
          
          %prep
          %autosetup
          
          %install
          mkdir -p %{buildroot}/usr/lib/%{name}
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          
          cp -r * %{buildroot}/usr/lib/%{name}/
          
          cat > %{buildroot}/usr/bin/%{name} << 'LAUNCHER'
          #!/bin/bash
          cd /usr/lib/%{name}
          ./%{name} "\$@"
          LAUNCHER
          chmod +x %{buildroot}/usr/bin/%{name}
          
          cat > %{buildroot}/usr/share/applications/%{name}.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Comment=A beautiful music streaming and management application
          Exec=%{name}
          Icon=%{name}
          Terminal=false
          Type=Application
          Categories=Audio;Music;Player;AudioVideo;
          StartupNotify=true
          DESKTOP
          
          # Copy icon
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          mkdir -p %{buildroot}/usr/share/pixmaps
          cp %{_builddir}/../../assets/images/logo_black_bg_white.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/%{name}.png
          cp %{_builddir}/../../assets/images/logo_black_bg_white.png %{buildroot}/usr/share/pixmaps/%{name}.png
          
          %files
          /usr/lib/%{name}
          /usr/bin/%{name}
          /usr/share/applications/%{name}.desktop
          /usr/share/icons/hicolor/256x256/apps/%{name}.png
          /usr/share/pixmaps/%{name}.png
          
          %changelog
          * $(date "+%a %b %d %Y") Kiokuu Team <support@kiokuu.app> - ${VERSION}-${BUILD_NUMBER}
          - Automated build ${BUILD_NUMBER} for version ${VERSION}
          SPEC
          
          # Build RPM
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/${{ env.PACKAGE_NAME }}.spec
          
          # Copy RPM to release artifacts
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} release-artifacts/linux/ \;

      - name: Build AppImage
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          
          # Download AppImage tools
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy application files
          cp -r build/linux/x64/release/bundle/* AppDir/usr/lib/
          
          # Create launcher
          cat > AppDir/usr/bin/${{ env.PACKAGE_NAME }} << 'LAUNCHER'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/../lib:${LD_LIBRARY_PATH}"
          cd "${HERE}/../lib"
          ./${{ env.PACKAGE_NAME }} "$@"
          LAUNCHER
          chmod +x AppDir/usr/bin/${{ env.PACKAGE_NAME }}
          
          # Create AppRun
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/${{ env.PACKAGE_NAME }}" "$@"
          APPRUN
          chmod +x AppDir/AppRun
          
          # Create desktop file
          cat > AppDir/${{ env.PACKAGE_NAME }}.desktop << DESKTOP
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Comment=A beautiful music streaming and management application
          Exec=${{ env.PACKAGE_NAME }}
          Icon=${{ env.PACKAGE_NAME }}
          Terminal=false
          Type=Application
          Categories=Audio;Music;Player;AudioVideo;
          Keywords=music;audio;streaming;player;cloud;
          StartupNotify=true
          StartupWMClass=${{ env.PACKAGE_NAME }}
          DESKTOP
          cp AppDir/${{ env.PACKAGE_NAME }}.desktop AppDir/usr/share/applications/
          
          # Create icon (placeholder - replace with actual icon)
          if [ -f "assets/images/logo_black_bg_white.png" ]; then
            cp assets/images/logo_black_bg_white.png AppDir/${{ env.PACKAGE_NAME }}.png
            cp assets/images/logo_black_bg_white.png AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.PACKAGE_NAME }}.png
          else
            # Create a placeholder icon
            convert -size 256x256 xc:#6366f1 AppDir/${{ env.PACKAGE_NAME }}.png 2>/dev/null || \
            echo "No icon found, using placeholder"
          fi
          
          # Build AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir \
            "release-artifacts/linux/${{ env.PACKAGE_NAME }}-${VERSION}-x86_64.AppImage"

      - name: Create tar.gz Archive
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          
          cd build/linux/x64/release/bundle
          tar czf "../../../../../release-artifacts/linux/${{ env.PACKAGE_NAME }}-${VERSION}-linux-x64.tar.gz" .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-artifacts/linux/
          retention-days: 30

  # ============================================================================
  # FLATPAK BUILD
  # ============================================================================
  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-22.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter in Container
        run: |
          # Install Flutter dependencies
          dnf install -y git curl unzip xz clang cmake ninja-build \
            gtk3-devel pkg-config mesa-libGL-devel which libsecret-devel

          # Download and setup Flutter
          git clone https://github.com/flutter/flutter.git -b stable /opt/flutter
          export PATH="/opt/flutter/bin:$PATH"
          flutter doctor
          flutter config --no-analytics

      - name: Create Flatpak Manifest
        run: |
          cat > ${{ env.APP_ID }}.yml << 'MANIFEST'
          app-id: ${{ env.APP_ID }}
          runtime: org.freedesktop.Platform
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          command: kiokuu
          finish-args:
            - --share=ipc
            - --socket=fallback-x11
            - --socket=wayland
            - --socket=pulseaudio
            - --device=dri
            - --share=network
            - --filesystem=xdg-music:ro
            - --filesystem=xdg-download:ro
            - --talk-name=org.freedesktop.Notifications
            - --talk-name=org.kde.StatusNotifierWatcher
            - --own-name=org.mpris.MediaPlayer2.kiokuu
          modules:
            - name: kiokuu
              buildsystem: simple
              build-commands:
                - install -Dm755 bundle/${{ env.PACKAGE_NAME }} /app/bin/${{ env.PACKAGE_NAME }}
                - cp -r bundle/lib /app/lib
                - cp -r bundle/data /app/data
                - install -Dm644 ${{ env.PACKAGE_NAME }}.desktop /app/share/applications/${{ env.APP_ID }}.desktop
                - install -Dm644 ${{ env.PACKAGE_NAME }}.png /app/share/icons/hicolor/256x256/apps/${{ env.APP_ID }}.png
              sources:
                - type: dir
                  path: build/linux/x64/release/
                - type: file
                  path: linux/packaging/appimage/${{ env.PACKAGE_NAME }}.desktop
                - type: file  
                  path: assets/images/logo_black_bg_white.png
                  dest-filename: ${{ env.PACKAGE_NAME }}.png
          MANIFEST

      - name: Get Dependencies and Build Flutter App
        run: |
          export PATH="/opt/flutter/bin:$PATH"
          flutter pub get
          flutter build linux --release --build-number=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))

      - name: Create Desktop Entry for Flatpak
        run: |
          mkdir -p linux/packaging/appimage
          # Icon must match APP_ID for Flatpak compliance
          cat > linux/packaging/appimage/${{ env.PACKAGE_NAME }}.desktop << EOF
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Comment=A beautiful music streaming and management application
          Exec=${{ env.PACKAGE_NAME }}
          Icon=${{ env.APP_ID }}
          Terminal=false
          Type=Application
          Categories=Audio;Music;Player;AudioVideo;
          Keywords=music;audio;streaming;player;
          StartupNotify=true
          StartupWMClass=${{ env.PACKAGE_NAME }}
          EOF

      - name: Free Disk Space
        run: |
          # Aggressive cleanup to free disk space for Flatpak export
          echo "=== Disk space before cleanup ==="
          df -h /
          
          # Remove Flutter git history (saves ~500MB)
          rm -rf /opt/flutter/.git || true
          
          # Remove Flutter caches
          rm -rf /opt/flutter/.pub-cache || true
          rm -rf /opt/flutter/bin/cache/artifacts || true
          
          # Remove SDK locales we don't need
          rm -rf /var/cache/* || true
          rm -rf /var/log/* || true
          rm -rf ~/.cache || true
          rm -rf /tmp/* || true
          
          # Remove debug symbols from Flutter build before Flatpak packages it
          find build/linux/x64/release/bundle -name "*.debug" -delete || true
          strip --strip-debug build/linux/x64/release/bundle/lib/*.so 2>/dev/null || true
          
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.APP_ID }}.yml
          bundle: ${{ env.PACKAGE_NAME }}.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Rename Flatpak
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          
          mkdir -p release-artifacts/linux
          mv ${{ env.PACKAGE_NAME }}.flatpak \
             "release-artifacts/linux/${{ env.PACKAGE_NAME }}-${VERSION}.flatpak"

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-release
          path: release-artifacts/linux/
          retention-days: 30

  # ============================================================================
  # ARCH LINUX BUILD - PKGBUILD for AUR
  # ============================================================================
  build-arch:
    name: Build Arch Linux (PKGBUILD)
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl unzip xz clang cmake \
            ninja gtk3 pkgconf mesa libsecret mpv

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable /opt/flutter --depth 1
          export PATH="/opt/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter doctor

      - name: Get dependencies
        run: |
          export PATH="/opt/flutter/bin:$PATH"
          flutter pub get

      - name: Build Linux
        run: |
          export PATH="/opt/flutter/bin:$PATH"
          flutter build linux --release --build-number=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))

      - name: Create tarball and PKGBUILD
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          BUILD_NUMBER=$(( ${{ env.BUILD_NUMBER_OFFSET }} + ${{ github.run_number }} ))
          
          mkdir -p release-artifacts/arch
          
          # Create tarball
          cd build/linux/x64/release/bundle
          tar czf "../../../../../release-artifacts/arch/${{ env.PACKAGE_NAME }}-${VERSION}-linux-x64.tar.gz" .
          cd ../../../../../
          
          # Calculate SHA256
          SHA256=$(sha256sum "release-artifacts/arch/${{ env.PACKAGE_NAME }}-${VERSION}-linux-x64.tar.gz" | cut -d' ' -f1)
          
          # Create PKGBUILD (Use build number as pkgrel)
          cat > release-artifacts/arch/PKGBUILD << EOF
          # Maintainer: Kiokuu Team <support@kiokuu.app>
          pkgname=${{ env.PACKAGE_NAME }}
          pkgver=${VERSION}
          pkgrel=${BUILD_NUMBER}
          pkgdesc="A beautiful music streaming and management application"
          arch=('x86_64')
          url="https://github.com/Xumi-cc/Kiokuu"
          license=('custom:proprietary')
          depends=(
              'gtk3'
              'mpv'
              'libsecret'
              'hicolor-icon-theme'
          )
          optdepends=(
              'pulseaudio: PulseAudio support'
              'pipewire-pulse: PipeWire PulseAudio support'
          )
          provides=('${{ env.PACKAGE_NAME }}')
          conflicts=('${{ env.PACKAGE_NAME }}-bin' '${{ env.PACKAGE_NAME }}-git')
          options=('!strip')
          source=("https://github.com/Xumi-cc/Kiokuu/releases/download/v\${pkgver}/${{ env.PACKAGE_NAME }}-\${pkgver}-linux-x64.tar.gz")
          sha256sums=('${SHA256}')
          
          package() {
              cd "\${srcdir}"
              
              install -dm755 "\${pkgdir}/usr/lib/\${pkgname}"
              install -dm755 "\${pkgdir}/usr/bin"
              install -dm755 "\${pkgdir}/usr/share/applications"
              install -dm755 "\${pkgdir}/usr/share/icons/hicolor/256x256/apps"
              install -dm755 "\${pkgdir}/usr/share/pixmaps"
              install -dm755 "\${pkgdir}/usr/share/licenses/\${pkgname}"
              
              cp -r * "\${pkgdir}/usr/lib/\${pkgname}/"
              
              cat > "\${pkgdir}/usr/bin/\${pkgname}" << 'LAUNCHER'
          #!/bin/bash
          cd /usr/lib/${{ env.PACKAGE_NAME }}
          ./${{ env.PACKAGE_NAME }} "\$@"
          LAUNCHER
              chmod +x "\${pkgdir}/usr/bin/\${pkgname}"
              
              cat > "\${pkgdir}/usr/share/applications/\${pkgname}.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=${{ env.APP_NAME }}
          Comment=A beautiful music streaming and management application
          Exec=${{ env.PACKAGE_NAME }}
          Icon=${{ env.PACKAGE_NAME }}
          Terminal=false
          Type=Application
          Categories=Audio;Music;Player;AudioVideo;
          Keywords=music;audio;streaming;player;cloud;
          StartupNotify=true
          StartupWMClass=${{ env.PACKAGE_NAME }}
          DESKTOP
              
              if [ -f "data/flutter_assets/assets/images/logo_black_bg_white.png" ]; then
                  install -Dm644 "data/flutter_assets/assets/images/logo_black_bg_white.png" \
                      "\${pkgdir}/usr/share/icons/hicolor/256x256/apps/\${pkgname}.png"
                  install -Dm644 "data/flutter_assets/assets/images/logo_black_bg_white.png" \
                      "\${pkgdir}/usr/share/pixmaps/\${pkgname}.png"
              fi
              
              cat > "\${pkgdir}/usr/share/licenses/\${pkgname}/LICENSE" << 'LICENSE'
          Copyright (c) 2024-2026 Kiokuu Team
          All Rights Reserved
          LICENSE
          }
          EOF
          
          # Create .SRCINFO
          cat > release-artifacts/arch/.SRCINFO << EOF
          pkgbase = ${{ env.PACKAGE_NAME }}
          	pkgdesc = A beautiful music streaming and management application
          	pkgver = ${VERSION}
          	pkgrel = ${BUILD_NUMBER}
          	url = https://github.com/Xumi-cc/Kiokuu
          	arch = x86_64
          	license = custom:proprietary
          	depends = gtk3
          	depends = mpv
          	depends = libsecret
          	depends = hicolor-icon-theme
          	optdepends = pulseaudio: PulseAudio support
          	optdepends = pipewire-pulse: PipeWire PulseAudio support
          	provides = ${{ env.PACKAGE_NAME }}
          	conflicts = ${{ env.PACKAGE_NAME }}-bin
          	conflicts = ${{ env.PACKAGE_NAME }}-git
          	options = !strip
          	source = https://github.com/Xumi-cc/Kiokuu/releases/download/v${VERSION}/${{ env.PACKAGE_NAME }}-${VERSION}-linux-x64.tar.gz
          	sha256sums = ${SHA256}
          
          pkgname = ${{ env.PACKAGE_NAME }}
          EOF

      - name: Upload Arch Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-release
          path: release-artifacts/arch/
          retention-days: 30

  # ============================================================================
  # CREATE GITHUB RELEASE
  # ============================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-android, build-ios, build-macos, build-windows, build-linux, build-flatpak, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout for Release Notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          
          # Copy all artifacts to release-assets with flattened structure
          find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ipa" \
            -o -name "*.dmg" -o -name "*.zip" -o -name "*.msix" \
            -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
            -o -name "*.flatpak" -o -name "*.tar.gz" -o -name "PKGBUILD" \) \
            -exec cp {} release-assets/ \;
          
          ls -la release-assets/

      - name: Generate Release Notes
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          
          # Start release notes
          cat > release-notes.md << 'EOF'
          # Kiokuu ${{ github.ref_name }}
          
          ## What's Changed
          
          EOF
          
          # Try to get changelog from git (will work if there are previous tags)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges >> release-notes.md
          else
            # First release - just add a simple message
            echo "- Initial release" >> release-notes.md
          fi
          
          # Add downloads section
          cat >> release-notes.md << EOF
          
          ## Downloads
          
          **Android**
          - \`kiokuu-${VERSION}-arm64-v8a.apk\` - ARM64 (recommended)
          - \`kiokuu-${VERSION}-armeabi-v7a.apk\` - ARM32
          - \`kiokuu-${VERSION}-x86_64.apk\` - x86_64
          
          **iOS**
          - \`kiokuu-${VERSION}-ios.ipa\`
          
          **macOS**
          - \`kiokuu-${VERSION}-macos.dmg\`
          
          **Windows**
          - \`kiokuu-${VERSION}-windows-portable.zip\` - Portable
          - \`kiokuu-${VERSION}-windows.msix\` - Installer
          
          **Linux**
          - \`kiokuu-${VERSION}-x86_64.AppImage\` - Universal (recommended)
          - \`kiokuu_${VERSION}_amd64.deb\` - Debian/Ubuntu (apt)
          - \`kiokuu-${VERSION}-1.x86_64.rpm\` - Fedora/RHEL (dnf)
          - \`kiokuu-${VERSION}.flatpak\` - Flatpak
          - PKGBUILD available in \`arch-release\` artifact - Arch Linux (AUR)
          
          ## Linux Repository Installation
          
          **Arch Linux (AUR):** \`yay -S kiokuu\` or \`paru -S kiokuu\`
          
          **Fedora/RHEL (COPR):** \`sudo dnf copr enable YOUR_USERNAME/kiokuu && sudo dnf install kiokuu\`
          
          **Debian/Ubuntu (APT):**
          
          \`\`\`
          echo "deb [trusted=yes] https://apt.kiokuu.app stable main" | sudo tee /etc/apt/sources.list.d/kiokuu.list
          sudo apt update && sudo apt install kiokuu
          \`\`\`
          
          ---
          
          Website: https://kiokuu.app
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kiokuu ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # UPDATE VERSION.JSON (for in-app update system)
  # ============================================================================
  update-version-json:
    name: Update version.json
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          
          echo "Updating version.json with version: $VERSION"
          
          # Read current version.json and update
          if [ -f version.json ]; then
            # Update latest_version and replace {version} placeholders in download URLs
            jq --arg ver "$VERSION" '
              .latest_version = $ver |
              .release_notes = "See full changelog on GitHub" |
              .download_urls.android.arm64 = (.download_urls.android.arm64 | gsub("{version}"; $ver)) |
              .download_urls.android.arm32 = (.download_urls.android.arm32 | gsub("{version}"; $ver)) |
              .download_urls.android.x86_64 = (.download_urls.android.x86_64 | gsub("{version}"; $ver)) |
              .download_urls.ios.ipa = (.download_urls.ios.ipa | gsub("{version}"; $ver)) |
              .download_urls.windows.portable = (.download_urls.windows.portable | gsub("{version}"; $ver)) |
              .download_urls.windows.msix = (.download_urls.windows.msix | gsub("{version}"; $ver)) |
              .download_urls.macos.dmg = (.download_urls.macos.dmg | gsub("{version}"; $ver)) |
              .download_urls.linux.appimage = (.download_urls.linux.appimage | gsub("{version}"; $ver)) |
              .download_urls.linux.deb = (.download_urls.linux.deb | gsub("{version}"; $ver)) |
              .download_urls.linux.rpm = (.download_urls.linux.rpm | gsub("{version}"; $ver)) |
              .download_urls.linux.flatpak = (.download_urls.linux.flatpak | gsub("{version}"; $ver)) |
              .download_urls.linux.tarball = (.download_urls.linux.tarball | gsub("{version}"; $ver))
            ' version.json > version.json.tmp
            mv version.json.tmp version.json
          else
            # Create new version.json if it doesn't exist
            cat > version.json << EOF
          {
            "latest_version": "$VERSION",
            "minimum_version": "$VERSION",
            "release_notes": "See full changelog on GitHub.",
            "force_update_message": "This update contains critical security fixes. Please update to continue using Kiokuu.",
            "download_urls": {
              "android": {
                "arm64": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu-$VERSION-arm64-v8a.apk",
                "arm32": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu-$VERSION-armeabi-v7a.apk",
                "x86_64": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu-$VERSION-x86_64.apk"
              },
              "ios": {
                "ipa": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu-$VERSION-ios.ipa"
              },
              "windows": {
                "portable": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu-$VERSION-windows-portable.zip",
                "msix": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu-$VERSION-windows.msix"
              },
              "macos": {
                "dmg": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu-$VERSION-macos.dmg"
              },
              "linux": {
                "appimage": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu-$VERSION-x86_64.AppImage",
                "deb": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu_${VERSION}_amd64.deb",
                "rpm": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu-$VERSION-1.x86_64.rpm",
                "flatpak": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu-$VERSION.flatpak",
                "tarball": "https://github.com/Xumi-cc/Kiokuu/releases/download/v$VERSION/kiokuu-$VERSION-linux-x64.tar.gz"
              }
            },
            "changelog_url": "https://github.com/Xumi-cc/Kiokuu/releases/latest"
          }
          EOF
          fi
          
          echo "Updated version.json:"
          cat version.json

      - name: Commit and Push version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          VERSION="${{ github.ref_name }}"
          
          git add version.json
          git diff --staged --quiet || git commit -m "Update version.json to $VERSION [skip ci]"
          git push origin main

  # ============================================================================
  # PUBLISH TO GOOGLE PLAY STORE
  # ============================================================================
  publish-play-store:
    name: Publish to Google Play Store
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts

      - name: Setup Ruby (for fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Create Google Play credentials file
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -n "$PLAY_STORE_JSON_KEY" ]; then
            echo "$PLAY_STORE_JSON_KEY" > play-store-key.json
          else
            echo "PLAY_STORE_JSON_KEY not configured, skipping Play Store upload"
            exit 0
          fi

      - name: Upload to Play Store (Internal Track)
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -z "$PLAY_STORE_JSON_KEY" ]; then
            echo "Skipping Play Store upload - no credentials"
            exit 0
          fi
          
          # Find the AAB file
          AAB_FILE=$(find artifacts -name "*.aab" | head -1)
          
          if [ -n "$AAB_FILE" ]; then
            echo "Uploading $AAB_FILE to Play Store..."
            
            # Use fastlane supply to upload
            fastlane supply \
              --aab "$AAB_FILE" \
              --track internal \
              --package_name "${{ env.APP_ID }}" \
              --json_key play-store-key.json \
              --skip_upload_metadata \
              --skip_upload_images \
              --skip_upload_screenshots
            
            echo "✅ Uploaded to Play Store Internal Track"
            echo "Review and promote to production at: https://play.google.com/console"
          else
            echo "No AAB file found!"
            exit 1
          fi

      - name: Cleanup credentials
        if: always()
        run: rm -f play-store-key.json

  # ============================================================================
  # PUBLISH TO COPR (Fedora/RHEL DNF Repository)
  # ============================================================================
  publish-copr:
    name: Publish to COPR (Fedora)
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: artifacts

      - name: Install COPR CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install copr-cli

      - name: Configure COPR
        env:
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr << EOF
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          username = ${{ secrets.COPR_USERNAME }}
          token = ${COPR_API_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Upload to COPR
        run: |
          # Find the RPM file
          RPM_FILE=$(find artifacts -name "*.rpm" | head -1)
          
          if [ -n "$RPM_FILE" ]; then
            echo "Uploading $RPM_FILE to COPR..."
            copr-cli build ${{ secrets.COPR_PROJECT }} "$RPM_FILE" || echo "COPR upload failed - check secrets"
          else
            echo "No RPM file found!"
            exit 1
          fi

  # ============================================================================
  # PUBLISH TO APT REPOSITORY (Debian/Ubuntu)
  # ============================================================================
  publish-apt:
    name: Publish to APT Repository
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: artifacts

      - name: Setup APT repository structure
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          
          mkdir -p apt-repo/pool/main/k/${{ env.PACKAGE_NAME }}
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          
          # Find and copy DEB file
          DEB_FILE=$(find artifacts -name "*.deb" | head -1)
          cp "$DEB_FILE" apt-repo/pool/main/k/${{ env.PACKAGE_NAME }}/

      - name: Generate APT repository metadata
        run: |
          cd apt-repo
          
          # Generate Packages file
          dpkg-scanpackages pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k dists/stable/main/binary-amd64/Packages
          
          # Generate Release file
          cat > dists/stable/Release << EOF
          Origin: Kiokuu
          Label: Kiokuu
          Suite: stable
          Codename: stable
          Version: 1.0
          Architectures: amd64
          Components: main
          Description: Kiokuu Music Application Repository
          EOF
          
          # Add checksums to Release
          cd dists/stable
          echo "SHA256:" >> Release
          for file in main/binary-amd64/Packages main/binary-amd64/Packages.gz; do
            if [ -f "$file" ]; then
              sha256sum "$file" | awk '{print " " $1 " " length " " $2}' >> Release
            fi
          done

      - name: Sign repository (if GPG key available)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            
            cd apt-repo/dists/stable
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign --output Release.gpg Release
            
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --clearsign --output InRelease Release
          else
            echo "No GPG key configured, skipping signing"
          fi

      - name: Deploy APT repo to GitHub Pages
        run: |
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone or create gh-pages branch
          git clone --depth 1 --branch gh-pages https://github.com/${{ github.repository }}.git gh-pages-repo 2>/dev/null || {
            mkdir gh-pages-repo
            cd gh-pages-repo
            git init
            git checkout -b gh-pages
            cd ..
          }
          
          # Copy APT repo to root (for apt.kiokuu.app subdomain)
          cp -r apt-repo/* gh-pages-repo/
          
          # Add CNAME file for custom domain
          echo "apt.kiokuu.app" > gh-pages-repo/CNAME
          
          # Create index.html
          cat > gh-pages-repo/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head><title>Kiokuu APT Repository</title></head>
          <body>
          <h1>Kiokuu APT Repository</h1>
          <h2>Installation</h2>
          <pre>
          # Add repository
          echo "deb [trusted=yes] https://apt.kiokuu.app stable main" | sudo tee /etc/apt/sources.list.d/kiokuu.list

          # Update and install
          sudo apt update
          sudo apt install kiokuu
          </pre>
          <p><a href="https://kiokuu.app">Visit Kiokuu Website</a></p>
          </body>
          </html>
          HTML
          
          # Export public GPG key if available
          if gpg --list-keys 2>/dev/null | grep -q .; then
            gpg --armor --export > gh-pages-repo/apt/gpg.key
          fi
          
          cd gh-pages-repo
          git add -A
          git commit -m "Update APT repository for ${{ github.ref_name }}" || echo "No changes to commit"
          
          # Push to gh-pages branch
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages --force

      - name: Upload APT repo artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: apt-repository
          path: apt-repo/
          retention-days: 90

  # ============================================================================
  # PUBLISH TO AUR (Arch User Repository)
  # ============================================================================
  publish-aur:
    name: Publish to AUR
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Arch artifacts
        uses: actions/download-artifact@v4
        with:
          name: arch-release
          path: artifacts

      - name: Setup SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
            chmod 600 ~/.ssh/aur
            
            cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF
            
            ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          else
            echo "AUR SSH key not configured"
            exit 0
          fi

      - name: Clone and update AUR package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "Skipping AUR publish - no SSH key configured"
            exit 0
          fi
          
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          
          # Clone AUR repository
          git clone ssh://aur@aur.archlinux.org/${{ env.PACKAGE_NAME }}.git aur-repo || {
            echo "AUR package doesn't exist yet. You need to create it first at:"
            echo "https://aur.archlinux.org/pkgsubmit/"
            exit 0
          }
          
          cd aur-repo
          
          # Copy new PKGBUILD and .SRCINFO
          cp ../artifacts/PKGBUILD .
          cp ../artifacts/.SRCINFO .
          
          # Configure git
          git config user.name "Kiokuu CI"
          git config user.email "ci@kiokuu.com"
          
          # Commit and push
          git add PKGBUILD .SRCINFO
          git commit -m "Update to version ${VERSION}"
          git push origin master

  # ============================================================================
  # CREATE REPOSITORY SETUP INSTRUCTIONS
  # ============================================================================
  create-repo-instructions:
    name: Generate Repository Instructions
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Create installation instructions
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          
          cat > INSTALL_INSTRUCTIONS.md << 'EOF'
          # Kiokuu Installation Instructions

          ## Arch Linux (AUR)

          Using yay:
          ```bash
          yay -S kiokuu
          ```

          Using paru:
          ```bash
          paru -S kiokuu
          ```

          Manual installation:
          ```bash
          git clone https://aur.archlinux.org/kiokuu.git
          cd kiokuu
          makepkg -si
          ```

          ## Fedora/RHEL (COPR)

          Enable the COPR repository:
          ```bash
          sudo dnf copr enable kiokuu/kiokuu
          sudo dnf install kiokuu
          ```

          Or download the RPM directly from the GitHub release.

          ## Debian/Ubuntu (APT)

          Add the repository:
          ```bash
          # Add GPG key
          curl -fsSL https://kiokuu.app/apt/gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/kiokuu.gpg

          # Add repository
          echo "deb [signed-by=/usr/share/keyrings/kiokuu.gpg] https://kiokuu.app/apt stable main" | \
            sudo tee /etc/apt/sources.list.d/kiokuu.list

          # Update and install
          sudo apt update
          sudo apt install kiokuu
          ```

          Or download the .deb directly from the GitHub release:
          ```bash
          wget https://github.com/Xumi-cc/Kiokuu/releases/latest/download/kiokuu_VERSION_amd64.deb
          sudo dpkg -i kiokuu_VERSION_amd64.deb
          sudo apt-get install -f  # Install dependencies
          ```

          ## Flatpak

          ```bash
          flatpak install kiokuu-VERSION.flatpak
          ```

          ## AppImage

          ```bash
          wget https://github.com/Xumi-cc/Kiokuu/releases/latest/download/kiokuu-VERSION-x86_64.AppImage
          chmod +x kiokuu-VERSION-x86_64.AppImage
          ./kiokuu-VERSION-x86_64.AppImage
          ```

          ## Portable tarball

          ```bash
          wget https://github.com/Xumi-cc/Kiokuu/releases/latest/download/kiokuu-VERSION-linux-x64.tar.gz
          tar xzf kiokuu-VERSION-linux-x64.tar.gz
          cd kiokuu
          ./kiokuu
          ```
          EOF
          
          echo "Installation instructions generated"

      - name: Upload instructions
        uses: actions/upload-artifact@v4
        with:
          name: installation-instructions
          path: INSTALL_INSTRUCTIONS.md
          retention-days: 90

